<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Kiosk Prototype</title>
    <style>
        /* Minimal layout CSS */
        body {
            background-color: black;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #kiosk-screen {
            background-color: white;
            color: black;
            width: 375px; 
            height: 667px; 
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            position: relative; /* Added relative positioning for absolute children */
        }
        .page {
            display: none;
        }
        .active {
            display: block;
        }
        /* Basic spacing for forms */
        input[type="text"], button {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .small-text {
            font-size: 12px;
            color: gray;
            margin-left: 25px;
        }
        .review-item {
            margin-bottom: 10px;
        }
        .edit-btn {
            width: auto;
            padding: 2px 8px;
            margin-left: 10px;
        }
    </style>
</head>
<body>

<div id="kiosk-screen">

    <!-- PAGE 1: Weighing -->
    <div id="page1" class="page active">
        <h2>Package Mailing Kiosk</h2>
        <p>Place item on scale</p>
        <p id="weight-display" style="text-align: center; font-size: 24px;">Waiting for package...</p>
        
        <button id="btn-confirm-weight" disabled onclick="goToPage('page2')">Confirm</button>
        
        <!-- Arrow moved below button and pinned to bottom -->
        <h1 style="position: absolute; bottom: 20px; left: 0; width: 100%; text-align: center; margin: 0;">⬇</h1>
    </div>

    <!-- PAGE 2: Address -->
    <div id="page2" class="page">
        <h2>Where is this going?</h2>
        
        <label>Address Line 1:</label>
        <input type="text" id="input-add1">
        
        <label>Address Line 2:</label>
        <input type="text" id="input-add2">
        
        <label>City:</label>
        <input type="text" id="input-city">
        
        <label>State:</label>
        <input type="text" id="input-state">

        <label>Zip Code:</label>
        <input type="text" id="input-zip">
        
        <button onclick="goToPage('page3')">Next</button>
    </div>

    <!-- PAGE 3: Mailing Options -->
    <div id="page3" class="page">
        <h2>Select Mailing Option:</h2>
        
        <div style="margin-bottom: 15px;">
            <label>
                <input type="radio" name="delivery" value="Overnight" data-price="12.00">
                $12.00 Overnight
            </label>
            <div class="small-text">arrives Sep 11</div>
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>
                <input type="radio" name="delivery" value="2-day" data-price="8.00">
                $8.00 2 day
            </label>
            <div class="small-text">arrives Sep 12-13</div>
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>
                <input type="radio" name="delivery" value="Ground" data-price="4.99">
                $4.99 ground
            </label>
            <div class="small-text">arrives Sep 15-18</div>
        </div>

        <button onclick="saveDeliveryAndGoToReview()">Next</button>
    </div>

    <!-- PAGE 4: Review and Pay -->
    <div id="page4" class="page">
        <h2>Review Your Order</h2>
        
        <div class="review-item">
            <strong>Weight:</strong> <span id="review-weight"></span>
            <button class="edit-btn" onclick="goToPage('page1')">Edit</button>
        </div>
        <div class="review-item">
            <strong>Address:</strong> <span id="review-address"></span>
            <button class="edit-btn" onclick="goToPage('page2')">Edit</button>
        </div>
        <div class="review-item">
            <strong>Delivery option:</strong> <span id="review-option"></span>
            <button class="edit-btn" onclick="goToPage('page3')">Edit</button>
        </div>
        <div class="review-item">
            <strong>Total:</strong> $<span id="review-total"></span>
        </div>

        <br>
        <button onclick="resetKiosk()">Cancel Order</button>
        <button onclick="goToPage('page5')">Tap to pay ➡</button>
    </div>

    <!-- PAGE 5: Done -->
    <div id="page5" class="page">
        <h1 style="text-align: center; font-size: 80px; margin-top: 100px;">✅</h1>
        <h2 style="text-align: center;">Done!</h2>
        <br><br>
        <button onclick="resetKiosk()">Start over</button>
    </div>

</div>

<script>
    let currentWeight = 0;
    let selectedAddress = "";
    let selectedOption = "";
    let selectedPrice = "0.00";

    function goToPage(pageId) {
        const pages = document.querySelectorAll('.page');
        pages.forEach(page => page.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');

        if (pageId === 'page1') {
            simulateScale();
        }
    }

    function simulateScale() {
        document.getElementById('weight-display').innerText = "Reading scale...";
        document.getElementById('btn-confirm-weight').disabled = true;

        setTimeout(() => {
            currentWeight = (Math.random() * 9.5 + 0.5).toFixed(2);
            document.getElementById('weight-display').innerText = currentWeight + " kg";
            document.getElementById('btn-confirm-weight').disabled = false;
        }, 2500);
    }

    function saveDeliveryAndGoToReview() {
        const options = document.getElementsByName('delivery');
        let optionSelected = false;
        
        for (const option of options) {
            if (option.checked) {
                selectedOption = option.value;
                selectedPrice = option.getAttribute('data-price');
                optionSelected = true;
                break;
            }
        }

        if (!optionSelected) {
            alert("Please select a mailing option.");
            return;
        }

        // Combine the new address fields
        const add1 = document.getElementById('input-add1').value;
        const add2 = document.getElementById('input-add2').value;
        const city = document.getElementById('input-city').value;
        const state = document.getElementById('input-state').value;
        const zip = document.getElementById('input-zip').value;
        
        // Filter out empty fields and join with commas
        const addressParts = [add1, add2, city, state, zip].filter(Boolean);
        selectedAddress = addressParts.join(', ');

        // Populate Page 4
        document.getElementById('review-weight').innerText = currentWeight + " kg";
        document.getElementById('review-address').innerText = selectedAddress || "100 Main St, 15213 Pittsburgh";
        document.getElementById('review-option').innerText = selectedOption;
        document.getElementById('review-total').innerText = selectedPrice;

        goToPage('page4');
    }

    function resetKiosk() {
        currentWeight = 0;
        document.getElementById('input-add1').value = "";
        document.getElementById('input-add2').value = "";
        document.getElementById('input-city').value = "";
        document.getElementById('input-state').value = "";
        document.getElementById('input-zip').value = "";
        
        const options = document.getElementsByName('delivery');
        options.forEach(opt => opt.checked = false);
        goToPage('page1');
    }

    window.onload = simulateScale;
</script>

</body>
</html>
